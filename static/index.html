<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Relay</title>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/style.css">
  <script src="/app.js" defer></script>
</head>
<body>

  <!-- Login Overlay -->
  <div id="login-overlay" class="overlay">
    <div class="login-card">
      <h1>Relay</h1>
      <p class="subtitle">Minimal WebSocket Chat</p>
      <form id="login-form">
        <label for="name-input">Username</label>
        <input id="name-input" type="text" maxlength="24" placeholder="Enter your name..." autocomplete="nickname" required autofocus>
        <p id="login-error" class="error-text"></p>
        <button id="btn-login" type="submit">Connect</button>
      </form>
    </div>
  </div>

  <!-- Main Application Shell -->
  <div id="app" class="app-layout" hidden>

    <!-- Sidebar: Users & Groups -->
    <aside class="sidebar">
      <div class="sidebar-header">
        <div class="user-badge">
          <span class="status-indicator online"></span>
          <strong id="my-name">User</strong>
        </div>
        <button id="btn-disconnect" class="btn-sm" title="Disconnect">Exit</button>
      </div>

      <div class="sidebar-section">
        <div class="section-title">
          <span>Users Online (<span id="user-count">0</span>)</span>
        </div>
        <ul id="user-list" class="item-list"></ul>
      </div>

      <div class="sidebar-section">
        <div class="section-title">
          <span>Groups</span>
          <button id="btn-new-group" class="btn-sm" title="Create Group">+ New</button>
        </div>
        <ul id="group-list" class="item-list"></ul>
      </div>
    </aside>

    <!-- Main Chat Workspace -->
    <main class="main-content">
      <!-- Empty State -->
      <div id="empty-state" class="empty-view">
        <p>Select an online user to start a private chat, or join a group room.</p>
      </div>

      <!-- Active Chat Room Panel -->
      <section id="chat-panel" class="chat-view" hidden>
        <header class="chat-header">
          <div class="room-details">
            <h2 id="room-title">Room</h2>
            <span id="room-members" class="room-members-text"></span>
          </div>
          <button id="btn-summarize" class="btn-sm">Summarize</button>
        </header>

        <!-- AI Summary Callout -->
        <div id="summary-box" class="summary-card" hidden>
          <div class="summary-header">
            <strong>AI Conversation Catch-up</strong>
            <button id="btn-close-summary" class="btn-sm">✕</button>
          </div>
          <p id="summary-text"></p>
          <small id="summary-model"></small>
        </div>

        <!-- Scrollable Message History -->
        <div id="message-list" class="message-container" role="log" aria-live="polite"></div>

        <!-- Message Composer -->
        <form id="composer" class="composer-form">
          <input type="file" id="file-input" hidden>
          <button type="button" id="btn-attach" class="btn-secondary" title="Attach file (up to 256 KiB)">Attach</button>
          <input type="text" id="message-input" placeholder="Type a message..." maxlength="4000" autocomplete="off" required>
          <button type="submit" id="btn-send" class="btn-primary">Send</button>
        </form>
      </section>
    </main>

  </div>

  <!-- Create Group Dialog -->
  <dialog id="group-dialog" class="modal">
    <form id="group-form" method="dialog">
      <h3>Create New Group</h3>
      <p class="modal-desc">You will be the first member. Other online users can choose to join.</p>
      <label for="group-name-input">Group Name</label>
      <input id="group-name-input" type="text" maxlength="40" placeholder="e.g. Study Group" required>
      <div class="modal-actions">
        <button type="button" id="btn-cancel-group" class="btn-secondary">Cancel</button>
        <button type="submit" class="btn-primary">Create</button>
      </div>
    </form>
  </dialog>

  <!-- Global Toast Notification -->
  <div id="toast" class="toast" hidden></div>

</body>
</html>
