<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Relay</title>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/style.css">
  <script src="/app.js" defer></script>
</head>
<body>

  <!-- Header -->
  <header id="app-header">
    <div class="brand">
      <h1>Relay</h1>
    </div>
    <div id="user-status" hidden>
      <span>Connected as: <strong id="my-name"></strong></span>
      <button id="btn-disconnect" type="button">Disconnect</button>
    </div>
  </header>

  <!-- Login View (shown before connecting) -->
  <main id="login-section">
    <div class="login-box">
      <h2>Connect</h2>
      <form id="login-form">
        <label for="name-input">Username:</label>
        <div class="input-row">
          <input id="name-input" type="text" maxlength="24" placeholder="Enter your name..." autocomplete="nickname" required autofocus>
          <button id="btn-login" type="submit">Connect</button>
        </div>
        <p id="login-error" class="error-msg"></p>
      </form>
    </div>
  </main>

  <!-- Main Chat Workspace (shown after connecting) -->
  <div id="chat-section" hidden>
    <div class="app-grid">

      <!-- Left Sidebar: Online Users & Groups -->
      <aside class="sidebar">
        <section class="sidebar-block">
          <h3>Online Users (<span id="user-count">0</span>)</h3>
          <ul id="user-list" class="plain-list"></ul>
        </section>

        <section class="sidebar-block">
          <h3>Groups</h3>
          <form id="create-group-form" class="inline-form">
            <input id="group-name-input" type="text" maxlength="40" placeholder="New group name..." required>
            <button type="submit">+ Create</button>
          </form>
          <ul id="group-list" class="plain-list"></ul>
        </section>
      </aside>

      <!-- Right Main: Active Chat Room -->
      <main class="chat-area">
        <div id="no-room-selected" class="empty-state">
          <p>Select an online user to start a private chat, or join a group.</p>
        </div>

        <div id="room-view" class="room-container" hidden>
          <header class="room-header">
            <div>
              <h2 id="room-title"></h2>
              <div id="room-members" class="room-members"></div>
            </div>
            <button id="btn-summarize" type="button">AI Summary</button>
          </header>

          <!-- AI Summary Box -->
          <div id="summary-box" class="summary-box" hidden>
            <div class="summary-title">
              <strong>AI Conversation Catch-up</strong>
              <button id="btn-close-summary" type="button">[Close]</button>
            </div>
            <div id="summary-text" class="summary-text"></div>
            <small id="summary-model" class="summary-model"></small>
          </div>

          <!-- Messages -->
          <div id="message-list" class="message-list" role="log" aria-live="polite"></div>

          <!-- Composer -->
          <form id="composer" class="composer">
            <input type="file" id="file-input" hidden>
            <button type="button" id="btn-attach" title="Attach file up to 256 KiB">Attach</button>
            <input id="message-input" type="text" maxlength="4000" placeholder="Type a message..." autocomplete="off" required>
            <button type="submit" id="btn-send">Send</button>
          </form>
        </div>
      </main>

    </div>
  </div>

  <!-- Toast Message -->
  <div id="toast" class="toast" hidden></div>

</body>
</html>
