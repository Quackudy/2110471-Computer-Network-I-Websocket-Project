<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Relay</title>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/style.css?v=2">
  <script src="/app.js?v=2" defer></script>
</head>
<body>

  <!-- Login (Shown before connecting) -->
  <div id="login-view">
    <h3 class="login-brand">Relay</h3>
    <p>Enter a username to connect:</p>
    <form id="login-form">
      <input id="name-input" type="text" maxlength="24" placeholder="Username" required autofocus>
      <button id="btn-login" type="submit">Connect</button>
      <div id="login-error" class="error"></div>
    </form>
  </div>

  <!-- Chat Application (Full Screen 2-Column Layout) -->
  <div id="chat-view" class="app" hidden>
    
    <!-- Left Sidebar: Brand, Identity, Users & Groups -->
    <aside>
      <div class="sidebar-top">
        <strong>Relay</strong>
        <div id="user-status" class="sidebar-user">
          <span class="muted"><b id="my-name"></b></span>
          <button id="btn-disconnect" type="button" title="Disconnect">Exit</button>
        </div>
      </div>

      <hr>

      <div>
        <h4>Online Users (<span id="user-count">0</span>)</h4>
        <ul id="user-list"></ul>
      </div>

      <hr>

      <div>
        <h4>Groups</h4>
        <form id="group-form">
          <input id="group-name-input" type="text" maxlength="40" placeholder="New group..." required>
          <button type="submit">+ Create</button>
        </form>
        <ul id="group-list"></ul>
      </div>
    </aside>

    <!-- Right Main: Active Room & Messages -->
    <main>
      <div id="empty-hint" class="hint">Select an online user or join a group to start reading messages.</div>

      <div id="room-panel" hidden>
        <div class="room-bar">
          <div>
            <b id="room-title"></b>
            <span id="room-members" class="muted"></span>
          </div>
          <div class="summary-actions">
            <label for="summary-provider">Model</label>
            <select id="summary-provider">
              <option value="gemini">Gemini (Qwen fallback)</option>
              <option value="ollama">Local Qwen</option>
            </select>
            <button id="btn-summarize" type="button">AI Summary</button>
          </div>
        </div>

        <!-- AI Summary -->
        <div id="summary-box" class="summary-box" hidden>
          <div class="summary-head">
            <b>Summary:</b>
            <button id="btn-close-summary" type="button">[Dismiss]</button>
          </div>
          <div id="summary-text"></div>
          <small id="summary-model" class="muted"></small>
        </div>

        <!-- Scrollable Messages -->
        <div id="msg-box" role="log"></div>

        <!-- Composer -->
        <form id="composer">
          <input type="file" id="file-input" hidden>
          <button type="button" id="btn-attach" title="Attach file up to 256 KiB">File</button>
          <input id="msg-input" type="text" maxlength="4000" placeholder="Type message..." required autocomplete="off">
          <button type="submit">Send</button>
        </form>
      </div>
    </main>

  </div>

  <div id="toast" hidden></div>

</body>
</html>
