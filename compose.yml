name: relay
services:
  app:
    image: ${APP_IMAGE:-relay:local}
    build: .
    restart: unless-stopped
    ports:
      - "127.0.0.1:${APP_PORT:-8080}:8080"
    environment:
      OLLAMA_URL: http://ollama:11434
      AI_MODEL: qwen2.5:0.5b
      PUBLIC_ORIGIN: ${PUBLIC_ORIGIN:-}
    depends_on:
      model-pull:
        condition: service_completed_successfully
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    mem_limit: 256m
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "2"

  ollama:
    image: ollama/ollama:0.40.3
    restart: unless-stopped
    volumes:
      - models:/root/.ollama
    environment:
      OLLAMA_NUM_PARALLEL: "1"
      OLLAMA_MAX_LOADED_MODELS: "1"
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 10s
      timeout: 5s
      retries: 12
    mem_limit: 2g
    cpus: 2
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "2"

  model-pull:
    image: ollama/ollama:0.40.3
    environment:
      OLLAMA_HOST: http://ollama:11434
    command: ["pull", "qwen2.5:0.5b"]
    depends_on:
      ollama:
        condition: service_healthy
    restart: "no"

volumes:
  models:
